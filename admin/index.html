<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CSA — Amministrazione</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/flatpickr.min.css">
  <link rel="stylesheet" href="../css/app.css">
</head>
<body>

  <div id="header-root"></div>

  <main class="container-lg py-4">
    <h2 class="page-title mb-4">Amministrazione</h2>

    <!-- ── Tabs ────────────────────────────────────────────────────────────── -->
    <ul class="nav nav-tabs mb-4" id="adminTabs" role="tablist">
      <li class="nav-item" role="presentation">
        <button class="nav-link active" id="tab-soci"        data-bs-toggle="tab" data-bs-target="#pane-soci"        type="button" role="tab">Membri</button>
      </li>
      <li class="nav-item" role="presentation">
        <button class="nav-link"        id="tab-calendario"  data-bs-toggle="tab" data-bs-target="#pane-calendario"  type="button" role="tab">Calendario</button>
      </li>
      <li class="nav-item" role="presentation">
        <button class="nav-link"        id="tab-destinatari" data-bs-toggle="tab" data-bs-target="#pane-destinatari" type="button" role="tab">Destinatari</button>
      </li>
    </ul>

    <div class="tab-content" id="adminTabContent">

      <!-- ── Tab: Membri ─────────────────────────────────────────────────────── -->
      <div class="tab-pane fade show active" id="pane-soci" role="tabpanel">
        <div class="d-flex justify-content-end mb-3">
          <button class="btn btn-success btn-sm" id="addOwnerBtn">
            <i class="bi bi-plus-lg me-1"></i>Aggiungi membro
          </button>
        </div>
        <div class="table-responsive">
          <table class="table table-hover align-middle">
            <thead class="table-light">
              <tr>
                <th>Nome e Cognome</th>
                <th>Quota</th>
                <th>Email</th>
                <th>Telefono</th>
                <th style="width:56px"></th>
              </tr>
            </thead>
            <tbody id="ownersTbody">
              <tr><td colspan="5" class="text-center text-muted py-3">Caricamento…</td></tr>
            </tbody>
          </table>
        </div>
      </div>

      <!-- ── Tab: Calendario ───────────────────────────────────────────────── -->
      <div class="tab-pane fade" id="pane-calendario" role="tabpanel">
        <div class="d-flex flex-wrap gap-2 justify-content-between align-items-center mb-3">
          <select id="eventTypeFilter" class="form-select w-auto">
            <option value="all">Tutti i tipi</option>
            <option value="inv">Partecipazione in campo</option>
            <option value="del">Distribuzione</option>
            <option value="evt">Evento</option>
          </select>
          <button class="btn btn-success btn-sm" id="addEventBtn">
            <i class="bi bi-plus-lg me-1"></i>Aggiungi evento
          </button>
        </div>
        <div id="adminCalendar"></div>
      </div>

      <!-- ── Tab: Destinatari ──────────────────────────────────────────────── -->
      <div class="tab-pane fade" id="pane-destinatari" role="tabpanel">
        <div id="recipientsList" class="mb-3"></div>
        <button class="btn btn-outline-secondary btn-sm mb-4" id="addRecipientBtn">
          <i class="bi bi-plus me-1"></i>Aggiungi destinatario
        </button>
        <div class="d-grid col-md-4">
          <button class="btn btn-success" id="saveRecipientsBtn">
            <i class="bi bi-check-lg me-1"></i>Salva destinatari
          </button>
        </div>
      </div>

    </div>
  </main>

  <!-- ── Modal: Quota owner ─────────────────────────────────────────────────── -->
  <div class="modal fade" id="ownerModal" tabindex="-1" aria-labelledby="ownerModalTitle" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="ownerModalTitle">Membro</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Chiudi"></button>
        </div>
        <div class="modal-body">
          <form id="ownerForm" novalidate>
            <input type="hidden" id="ownerEditId">

            <div class="mb-3">
              <label for="ownerName" class="form-label fw-semibold">Nome <span class="text-danger">*</span></label>
              <input type="text" id="ownerName" class="form-control" maxlength="256" placeholder="Inserisci Nome"
                     data-bs-toggle="tooltip" title="Inserisci Nome" required>
            </div>
            <div class="mb-3">
              <label for="ownerSurname" class="form-label fw-semibold">Cognome <span class="text-danger">*</span></label>
              <input type="text" id="ownerSurname" class="form-control" maxlength="256" placeholder="Inserisci Cognome"
                     data-bs-toggle="tooltip" title="Inserisci Cognome" required>
            </div>
            <div class="mb-3">
              <label for="ownerQuota" class="form-label fw-semibold">Quota <span class="text-danger">*</span></label>
              <select id="ownerQuota" class="form-select" required>
                <option value="" disabled selected>Seleziona quota…</option>
                <option value="quota_intera">Quota intera</option>
                <option value="mezza_quota">Mezza quota</option>
              </select>
            </div>
            <div class="mb-3">
              <label for="ownerEmail" class="form-label fw-semibold">Email <span class="text-danger">*</span></label>
              <input type="email" id="ownerEmail" class="form-control" placeholder="Inserisci email comunicata all'asta"
                     data-bs-toggle="tooltip" title="Inserisci email comunicata all'asta" required>
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold">Cellulare <span class="text-danger">*</span></label>
              <div class="input-group">
                <select id="ownerPhonePrefix" class="form-select" style="max-width:110px">
                  <option value="+39" selected>🇮🇹 +39</option>
                  <option value="+1">🇺🇸 +1</option>
                  <option value="+44">🇬🇧 +44</option>
                  <option value="+33">🇫🇷 +33</option>
                  <option value="+49">🇩🇪 +49</option>
                  <option value="+34">🇪🇸 +34</option>
                  <option value="+41">🇨🇭 +41</option>
                  <option value="+43">🇦🇹 +43</option>
                </select>
                <input type="tel" id="ownerPhone" class="form-control"
                       placeholder="Inserisci cellulare comunicato in fase di asta"
                       data-bs-toggle="tooltip" title="Inserisci cellulare comunicato in fase di asta" required>
              </div>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary me-auto" id="clearOwnerFormBtn">
            <i class="bi bi-eraser me-1"></i>Pulisci
          </button>
          <button type="button" class="btn btn-danger" data-bs-dismiss="modal">
            <i class="bi bi-x-lg me-1"></i>Chiudi
          </button>
          <button type="button" class="btn btn-success" id="saveOwnerBtn">
            <i class="bi bi-check-lg me-1"></i>Salva
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- ── Modal: Calendar event ──────────────────────────────────────────────── -->
  <div class="modal fade" id="eventModal" tabindex="-1" aria-labelledby="eventModalTitle" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="eventModalTitle">Evento</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Chiudi"></button>
        </div>
        <div class="modal-body">
          <form id="eventForm" novalidate>
            <input type="hidden" id="eventEditId">

            <div class="mb-3">
              <label for="eventDate" class="form-label fw-semibold">Data e ora <span class="text-danger">*</span></label>
              <input type="text" id="eventDate" class="form-control" placeholder="gg/mm/aaaa hh:mm" required>
            </div>
            <div class="mb-3">
              <label for="eventType" class="form-label fw-semibold">Tipo <span class="text-danger">*</span></label>
              <select id="eventType" class="form-select" required>
                <option value="" disabled selected>Seleziona tipo…</option>
                <option value="inv">Partecipazione</option>
                <option value="del">Distribuzione</option>
                <option value="evt">Evento</option>
              </select>
            </div>
            <div class="mb-3">
              <label for="eventDescription" class="form-label fw-semibold">Descrizione</label>
              <textarea id="eventDescription" class="form-control" rows="3" maxlength="1024"
                        data-bs-toggle="tooltip" title="Es raccolta piselli. Consiglio: porta l'impermeabile"
                        placeholder="Es raccolta piselli. Consiglio: porta l'impermeabile"></textarea>
            </div>

            <!-- Delivery-only fields -->
            <div id="deliveryFields" class="d-none">
              <div class="mb-3">
                <label for="eventDeliveryPoint" class="form-label fw-semibold">Punto di consegna</label>
                <select id="eventDeliveryPoint" class="form-select">
                  <option value="" disabled selected>Seleziona punto…</option>
                  <option value="prt">Picchetto (Portello)</option>
                  <option value="arc">Pedro (Arcella)</option>
                  <option value="mrn">Mirano</option>
                </select>
              </div>
              <div class="mb-3">
                <label for="eventDeadline" class="form-label fw-semibold">Termine per modifiche</label>
                <input type="text" id="eventDeadline" class="form-control" placeholder="gg/mm/aaaa hh:mm">
                <div class="form-text">Default: due giorni prima della distribuzione</div>
              </div>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary me-auto" id="clearEventFormBtn">
            <i class="bi bi-eraser me-1"></i>Pulisci
          </button>
          <button type="button" class="btn btn-danger" data-bs-dismiss="modal">
            <i class="bi bi-x-lg me-1"></i>Chiudi
          </button>
          <button type="button" class="btn btn-success" id="saveEventBtn">
            <i class="bi bi-check-lg me-1"></i>Salva
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- ── Modal: Involvement participants (admin) ──────────────────────────── -->
  <div class="modal fade" id="adminInvModal" tabindex="-1" aria-labelledby="adminInvModalTitle" aria-hidden="true">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="adminInvModalTitle">Partecipanti attività</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Chiudi"></button>
        </div>
        <div class="modal-body">
          <div class="alert alert-secondary py-2 mb-3" id="adminInvEventInfo"></div>
          <input type="hidden" id="adminInvEventId">

          <!-- Panel A: participants list -->
          <div id="adminInvListPanel">
            <div class="d-flex align-items-center justify-content-between mb-3">
              <span class="fw-semibold text-muted small">Iscritti a questa attività</span>
              <button type="button" class="btn btn-primary btn-sm" id="adminPartecipaBtnInv">
                <i class="bi bi-plus-circle me-1"></i>Partecipa
              </button>
            </div>
            <div id="adminInvParticipantsList"></div>
          </div>

          <!-- Panel B: subscription form -->
          <div id="adminInvFormPanel" class="d-none">
            <div class="mb-3">
              <label for="adminInvQuotaOwnerPicker-search" class="form-label fw-semibold">
                Chi partecipa? <span class="text-danger">*</span>
              </label>
              <div id="adminInvQuotaOwnerPicker"></div>
              <input type="hidden" id="adminInvQuotaOwner" required>
            </div>

            <!-- Participants repeater -->
            <div class="mb-3">
              <label class="form-label fw-semibold">Altri Partecipanti</label>
              <div id="adminParticipantsList">
                <div class="input-group mb-2 participant-row">
                  <input type="text" class="form-control participant-name" maxlength="256"
                         placeholder="Nome e cognome partecipante">
                  <button type="button" class="btn btn-outline-danger remove-participant"
                          title="Rimuovi" tabindex="-1" aria-label="Rimuovi partecipante">
                    <i class="bi bi-dash"></i>
                  </button>
                </div>
              </div>
              <button type="button" class="btn btn-outline-secondary btn-sm" id="adminAddParticipantBtn">
                <i class="bi bi-plus"></i> Aggiungi partecipante
              </button>
            </div>

            <div class="mb-3">
              <label for="adminInvDuration" class="form-label fw-semibold">Durata</label>
              <input type="text" id="adminInvDuration" class="form-control" maxlength="512"
                     placeholder="e.s. mattina/pomeriggio/tutto il giorno">
            </div>

            <div class="mb-3">
              <label for="adminInvPranzo" class="form-label fw-semibold">Pranzo</label>
              <input type="text" id="adminInvPranzo" class="form-control" maxlength="512"
                     placeholder="Porto pranzo da condividere">
            </div>
          </div>
        </div>

        <!-- Footer: list view -->
        <div class="modal-footer" id="adminInvListFooter">
          <button type="button" class="btn btn-danger" data-bs-dismiss="modal">
            <i class="bi bi-x-lg me-1"></i>Chiudi
          </button>
        </div>
        <!-- Footer: form view -->
        <div class="modal-footer d-none" id="adminInvFormFooter">
          <button type="button" class="btn btn-outline-secondary me-auto" id="adminClearInvFormBtn">
            <i class="bi bi-eraser me-1"></i>Pulisci
          </button>
          <button type="button" class="btn btn-outline-secondary" id="adminBackToInvListBtn">
            <i class="bi bi-arrow-left me-1"></i>Lista
          </button>
          <button type="button" class="btn btn-danger" data-bs-dismiss="modal">
            <i class="bi bi-x-lg me-1"></i>Chiudi
          </button>
          <button type="button" class="btn btn-success" id="adminSaveInvBtn">
            <i class="bi bi-check-lg me-1"></i>Salva
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/locales-all.global.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/flatpickr.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/l10n/it.js"></script>
  <script type="module" src="../js/admin.js"></script>

</body>
</html>
