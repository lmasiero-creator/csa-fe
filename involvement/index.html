<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CSA — Partecipazione in campo</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.css">
  <link rel="stylesheet" href="../css/app.css">
</head>
<body>

  <div id="header-root"></div>

  <main class="container-lg py-4">
    <h2 class="page-title mb-2">Partecipazione in campo</h2>
    <p class="text-muted mb-4">
      Clicca su una data per partecipare alle attività in campo
      <span class="badge" style="background:#198754">Verde</span> = iscritti presenti &nbsp;
      <span class="badge" style="background:#dc3545">Rosso</span> = nessun iscritto
    </p>
    <div id="involvementCalendar"></div>
  </main>

  <!-- ── Modal: Subscription ────────────────────────────────────────────────── -->
  <div class="modal fade" id="subscriptionModal" tabindex="-1" aria-labelledby="subscriptionModalTitle" aria-hidden="true">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="subscriptionModalTitle">Iscrizione attività</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Chiudi"></button>
        </div>
        <div class="modal-body">
          <div class="alert alert-secondary py-2 mb-3" id="subEventInfo"></div>
          <input type="hidden" id="subEventId">

          <!-- Panel A: list of existing subscriptions -->
          <div id="invParticipantsPanel">
            <div class="d-flex align-items-center justify-content-between mb-3">
              <span class="fw-semibold text-muted small">Iscritti a questa attività</span>
              <button type="button" class="btn btn-primary btn-sm" id="partecipaBtnInv">
                <i class="bi bi-plus-circle me-1"></i>Partecipa
              </button>
            </div>
            <div id="invParticipantsList"></div>
          </div>

          <!-- Panel B: subscription form (hidden by default) -->
          <div id="invFormPanel" class="d-none">
            <form id="subscriptionForm" novalidate>

              <div class="mb-3">
                <label for="subQuotaOwnerPicker-search" class="form-label fw-semibold">
                  Chi sei? <span class="text-danger">*</span>
                </label>
                <div id="subQuotaOwnerPicker"></div>
                <input type="hidden" id="subQuotaOwner" name="subQuotaOwner" required>
              </div>

              <!-- Participants repeater -->
              <div class="mb-3">
                <label class="form-label fw-semibold">
                  Altri Partecipanti
                </label>
                <div id="participantsList">
                  <div class="input-group mb-2 participant-row">
                    <input type="text" class="form-control participant-name" maxlength="256"
                           placeholder="Nome e cognome partecipante">
                    <button type="button" class="btn btn-outline-danger remove-participant"
                            title="Rimuovi" tabindex="-1" aria-label="Rimuovi partecipante">
                      <i class="bi bi-dash"></i>
                    </button>
                  </div>
                </div>
                <button type="button" class="btn btn-outline-secondary btn-sm" id="addParticipantBtn">
                  <i class="bi bi-plus"></i> Aggiungi partecipante
                </button>
              </div>

              <div class="mb-3">
                <label for="subDuration" class="form-label fw-semibold">Durata</label>
                <input type="text" id="subDuration" class="form-control" maxlength="512"
                       placeholder="e.s. mattina/pomeriggio/tutto il giorno"
                       data-bs-toggle="tooltip" title="e.s. mattina/pomeriggio/tutto il giorno">
              </div>

              <div class="mb-3">
                <label for="subPranzo" class="form-label fw-semibold">Pranzo</label>
                <input type="text" id="subPranzo" class="form-control" maxlength="512"
                       placeholder="Porto pranzo da condividere"
                       data-bs-toggle="tooltip" title="Porto pranzo da condividere">
              </div>
            </form>
          </div>
        </div>

        <!-- Footer: list view -->
        <div class="modal-footer" id="invListFooter">
          <button type="button" class="btn btn-danger" data-bs-dismiss="modal">
            <i class="bi bi-x-lg me-1"></i>Chiudi
          </button>
        </div>
        <!-- Footer: form view -->
        <div class="modal-footer d-none" id="invFormFooter">
          <button type="button" class="btn btn-outline-secondary me-auto" id="clearSubFormBtn">
            <i class="bi bi-eraser me-1"></i>Pulisci
          </button>
          <button type="button" class="btn btn-outline-secondary" id="backToInvListBtn">
            <i class="bi bi-arrow-left me-1"></i>Lista
          </button>
          <button type="button" class="btn btn-danger" data-bs-dismiss="modal">
            <i class="bi bi-x-lg me-1"></i>Chiudi
          </button>
          <button type="button" class="btn btn-success" id="saveSubBtn">
            <i class="bi bi-check-lg me-1"></i>Salva
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/locales-all.global.min.js"></script>
  <script type="module" src="../js/involvement.js"></script>

</body>
</html>
