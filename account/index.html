<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CSA — Il mio account</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../css/app.css">
</head>
<body>

  <!-- Shared navigation bar is injected here by layout.js -->
  <div id="header-root"></div>

  <main class="container py-4" style="max-width: 540px">
    <h2 class="page-title mb-4">Il mio account</h2>

    <!-- ── Avatar ──────────────────────────────────────────────────────────── -->
    <div class="d-flex justify-content-center mb-3">
      <div class="avatar-wrapper">
        <!--
          Clicking the avatar opens the hidden file input.
          account.js populates this element with either an <img> or initials text.
        -->
        <div id="avatar"
             class="avatar-circle"
             role="button"
             tabindex="0"
             data-bs-toggle="tooltip"
             data-bs-placement="bottom"
             title="Clicca per caricare la foto profilo">
          <!-- populated by account.js -->
        </div>
        <div class="avatar-overlay" role="button" tabindex="0" aria-label="Carica foto profilo">
          <i class="bi bi-camera-fill text-white fs-5"></i>
        </div>
      </div>

      <!-- Hidden file input — triggered programmatically -->
      <input type="file"
             id="photoInput"
             accept=".jpg,.jpeg,.png,.webp"
             class="d-none"
             aria-label="Carica foto profilo">
    </div>

    <p class="text-center text-muted small mb-4">
      Dimensioni consigliate: 1280×640 px &nbsp;·&nbsp; Minimo: 640×320 px<br>
      Formati accettati: JPG, PNG, WebP &nbsp;·&nbsp; Dimensione massima: 5 MB
    </p>

    <!-- ── Profile form ─────────────────────────────────────────────────────── -->
    <form id="accountForm" novalidate>

      <!-- Chi sei? — select from quota owners list -->
      <div class="mb-3">
        <label for="quotaOwnerPicker-search" class="form-label fw-semibold">
          Chi sei? <span class="text-danger" aria-hidden="true">*</span>
        </label>
        <div id="quotaOwnerPicker"></div>
        <div class="form-text">
          La tua scelta viene ricordata su questo dispositivo.
        </div>
      </div>

      <!-- Descrizione personale -->
      <div class="mb-4">
        <label for="description" class="form-label fw-semibold">
          Descrizione personale
        </label>
        <textarea id="description"
                  name="description"
                  class="form-control"
                  rows="4"
                  maxlength="512"
                  placeholder="Raccontaci qualcosa di te…"
                  data-bs-toggle="tooltip"
                  data-bs-placement="top"
                  title="Descrizione personale (max 512 caratteri)"></textarea>
        <div class="text-end char-counter mt-1">
          <span id="descCounter">0 / 512</span>
        </div>
      </div>

      <!-- Save button -->
      <div class="d-grid">
        <button type="submit" class="btn btn-success btn-lg">
          <i class="bi bi-check-lg me-1"></i>Salva
        </button>
      </div>

    </form>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!--
    account.js imports layout.js (which injects the nav + toast container)
    and then runs the page-specific logic.  A single <script type="module"> is
    sufficient — no need to also load layout.js explicitly.
  -->
  <script type="module" src="../js/account.js"></script>

</body>
</html>
