<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CSA — Distribuzioni</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.css">
  <link rel="stylesheet" href="../css/app.css">
</head>
<body>

  <div id="header-root"></div>

  <main class="container-lg py-4">
    <h2 class="page-title mb-2">Distribuzioni</h2>
    <p class="text-muted mb-4">
      Clicca su una distribuzione per comunicare una variazione.
      Le distribuzioni con termine scaduto sono disabilitate.
    </p>
    <div id="deliveryCalendar"></div>
  </main>

  <!-- ── Modal: Delivery change ─────────────────────────────────────────────── -->
  <div class="modal fade" id="deliveryModal" tabindex="-1" aria-labelledby="deliveryModalTitle" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="deliveryModalTitle">Variazione distribuzione</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Chiudi"></button>
        </div>
        <div class="modal-body">
          <form id="deliveryForm" novalidate>
            <input type="hidden" id="deliveryEventId">

            <div class="mb-3">
              <label for="deliveryDate" class="form-label fw-semibold">Data distribuzione</label>
              <input type="text" id="deliveryDate" class="form-control" readonly>
            </div>

            <div class="mb-3">
              <label for="deliveryQuotaOwner" class="form-label fw-semibold">
                Chi sei? <span class="text-danger">*</span>
              </label>
              <select id="deliveryQuotaOwner" class="form-select" required>
                <option value="" disabled selected>Seleziona il tuo nome…</option>
              </select>
            </div>

            <div class="mb-3">
              <label for="deliveryPoint" class="form-label fw-semibold">
                Nuovo punto di consegna <span class="text-danger">*</span>
              </label>
              <select id="deliveryPoint" class="form-select" required>
                <option value="" disabled selected>Seleziona punto…</option>
                <option value="prt">Picchetto (Portello)</option>
                <option value="arc">Pedro (Arcella)</option>
                <option value="mrn">Mirano</option>
              </select>
            </div>

            <div class="mb-3">
              <label for="deliveryDescription" class="form-label fw-semibold">Note</label>
              <textarea id="deliveryDescription" class="form-control" rows="3" maxlength="1024"
                        placeholder="Es. al mio posto ritira o dona la mia quota alla cassetta di scambio o sposta a Venerdì"
                        data-bs-toggle="tooltip"
                        title="Es. al mio posto ritira o dona la mia quota alla cassetta di scambio o sposta a Venerdì">
              </textarea>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" id="clearDeliveryFormBtn">
            <i class="bi bi-x-circle me-1"></i>Cancella
          </button>
          <button type="button" class="btn btn-success" id="saveDeliveryBtn">
            <i class="bi bi-check-lg me-1"></i>Salva
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
  <script type="module" src="../js/delivery.js"></script>

</body>
</html>
