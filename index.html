<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CSA — Benvenuto</title>
  <link rel="icon" href="data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='72' font-size='72'%3E%F0%9F%8C%B1%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>

  <div id="header-root"></div>

  <main class="container py-5 text-center">
    <h1 class="display-5 fw-bold mb-1">🌱 CSA</h1>
    <p class="lead text-muted mb-5">Community Supported Agriculture</p>

    <div class="row justify-content-center g-3">
      <div class="col-12 col-sm-4 col-md-3">
        <a href="involvement/" class="btn btn-outline-success w-100 py-3">
          <i class="bi bi-calendar-check fs-4 d-block mb-1"></i>
          Partecipazione in campo
        </a>
      </div>
      <div class="col-12 col-sm-4 col-md-3">
        <a href="delivery/" class="btn btn-outline-primary w-100 py-3">
          <i class="bi bi-truck fs-4 d-block mb-1"></i>
          Distribuzione
        </a>
      </div>
      <div class="col-12 col-sm-4 col-md-3">
        <a href="admin/" class="btn btn-outline-secondary w-100 py-3">
          <i class="bi bi-gear fs-4 d-block mb-1"></i>
          Admin
        </a>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- layout.js is loaded as a module so it self-injects the nav bar -->
  <script type="module" src="js/layout.js"></script>

</body>
</html>
